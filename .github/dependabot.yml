version: 2
updates:
  # Actions go stale quietly: the first CI run here was already two major
  # versions behind and only said so as a deprecation warning.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Only the comparison module has dependencies at all. Keeping them current is
  # the point: a comparison against three-year-old versions is not one.
  - package-ecosystem: gomod
    directory: /benchmarks
    schedule:
      interval: monthly
